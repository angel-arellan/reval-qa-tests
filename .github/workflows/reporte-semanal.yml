name: Informe semanal de QA por mail (lunes)

# Manda los lunes un mail con el resumen de la semana anterior (lunes a domingo) de todos los
# proyectos, con un PDF por proyecto escrito para reenviar al cliente. Ver
# .github/scripts/reporte-semanal.js. Solo lee resultados de GitHub Actions: no corre tests.
#
# Secrets: MAIL_USERNAME (cuenta de Gmail que envía), MAIL_PASSWORD (contraseña de aplicación
# de esa cuenta, no la contraseña normal) y REPORTE_DESTINATARIOS (mails separados por coma).
#
# GitHub larga las corridas programadas con horas de demora o directamente no las larga (el
# 09-nov el de las 08:30 salió 18:36; el 16-nov no salió ninguno de los tres en todo el día).
# Por eso hay un horario por hora el lunes desde las 08:30 y unos más el martes: el primero que
# corre manda el informe y los siguientes ven que ya salió esta semana y terminan en segundos.
# Un envío manual sin opciones también cuenta como el informe de la semana; las pruebas no.
# Los PDF NO se suben como artifact: el repo es público y son informes de clientes.

run-name: ${{ (inputs.prueba || inputs.enviar_a || inputs.ultimos_dias) && 'Informe semanal (prueba)' || 'Informe semanal' }}

on:
  schedule:
    - cron: '30 11 * * 1' # lunes 08:30 (Argentina)
    - cron: '47 12-23 * * 1' # lunes 09:47 a 20:47, por si GitHub no disparó el anterior
    - cron: '47 0-14/2 * * 2' # lunes 21:47 a martes 11:47, último recurso
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Prueba: mandar solo a la cuenta que envía (secret MAIL_USERNAME), sin dejar el mail a la vista en el log'
        type: boolean
        default: false
      enviar_a:
        description: 'Mandar solo a este mail (ojo: el repo es público y queda visible en el log). Vacío = destinatarios del secret REPORTE_DESTINATARIOS'
        required: false
      ultimos_dias:
        description: 'Usar los últimos N días hasta ahora en vez de la semana anterior completa (ej. 7)'
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: reporte-semanal
  cancel-in-progress: false

jobs:
  informe:
    name: Armar y enviar informe semanal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ¿Ya se mandó esta semana?
        id: ya
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lunes 00:00 de esta semana en Argentina (UTC-3, sin horario de verano), en UTC.
          LUNES=$(date -u -d "$(TZ=America/Argentina/Buenos_Aires date -d "$(( $(TZ=America/Argentina/Buenos_Aires date +%u) - 1 )) days ago" +%Y-%m-%d) 03:00" +%Y-%m-%dT%H:%M:%SZ)
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/reporte-semanal.yml/runs?status=success&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .created_at >= \"$LUNES\" and .display_title == \"Informe semanal\")] | length")
          echo "Informes enviados desde el lunes ($LUNES): $N"
          if [ "$N" -gt 0 ]; then echo "enviado=si" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.ya.outputs.enviado != 'si'

      - uses: actions/setup-node@v4
        if: steps.ya.outputs.enviado != 'si'
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: steps.ya.outputs.enviado != 'si'
        run: |
          npm ci || (sleep 20 && npm ci)
          npm install --no-save nodemailer@6.9.16

      # Chromium se usa solo para convertir los informes a PDF.
      - name: Install Chromium
        if: steps.ya.outputs.enviado != 'si'
        run: bash .github/scripts/instalar-chromium.sh

      - name: Armar y enviar informe
        if: steps.ya.outputs.enviado != 'si'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          REPORTE_DESTINATARIOS: ${{ inputs.enviar_a || (inputs.prueba && secrets.MAIL_USERNAME) || secrets.REPORTE_DESTINATARIOS }}
          REPORTE_FIRMA: ${{ vars.REPORTE_FIRMA }}
          ULTIMOS: ${{ inputs.ultimos_dias }}
        run: node .github/scripts/reporte-semanal.js --salida reporte-semanal --enviar ${ULTIMOS:+--ultimos $ULTIMOS}
