name: Playwright Daily E2E Regression - Reval (Lunes a Lunes)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  staging-tests:
    name: Staging Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Staging Tests
        id: run_staging_tests
        run: npx playwright test tests/reval-smoke-regression.spec.js tests/reval-customer-portal-stg.spec.js --reporter=html

      - name: Upload Staging HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack on Staging Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *ALERTA DE REGRESIÓN - STAGING*\n\n⚠️ *Atención Angel-Claudio:* Fallo detectado en el entorno de *STAGING* (Admin o Portal del Cliente).\n\n📌 *Algún módulo de estos pudo haber fallado:*\n• Dashboard\n• Suscripciones\n• Clientes\n• Pedidos\n• Planes\n• Productos\n• Sorpresas\n• Herramientas\n• Configuración\n• Portal de cliente"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

  production-tests:
    name: Production Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Production Tests
        id: run_prod_tests
        run: npx playwright test tests/reval-prod-regression.spec.js tests/reval-customer-portal-prod.spec.js --reporter=html

      - name: Upload Production HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack on Production Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *ALERTA DE REGRESIÓN - PRODUCCIÓN*\n\n⚠️ *Atención Angel-Claudio:* Fallo detectado en el entorno de *PRODUCCIÓN* (Admin o Portal del Cliente).\n\n📌 *Algún módulo de estos pudo haber fallado:*\n• Dashboard\n• Suscripciones\n• Clientes\n• Pedidos\n• Planes\n• Productos\n• Sorpresas\n• Herramientas\n• Configuración\n• Portal de cliente"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
