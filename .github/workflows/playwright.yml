name: Playwright Daily E2E Regression - Reval (Cada 1 hora)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  staging-tests:
    name: Staging Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: resultados.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps || (sleep 30 && npx playwright install --with-deps) || (sleep 60 && npx playwright install --with-deps)

      - name: Run Staging Tests
        id: run_staging_tests
        continue-on-error: true
        run: npx playwright test tests/reval-smoke-regression.spec.js tests/reval-customer-portal-stg.spec.js --reporter=html,json

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas
        id: confirm_staging
        if: steps.run_staging_tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/reval-smoke-regression.spec.js tests/reval-customer-portal-stg.spec.js --reporter=html,json --last-failed

      - name: Upload Staging HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 30

      # Alerta unificada (.github/scripts/alerta-slack.js): solo si la falla se CONFIRMÓ en la
      # segunda pasada, y dice qué test falló y por qué. Fallas del entorno de GitHub (npm,
      # instalación del navegador) no alertan: no son problemas de la tienda.
      - name: Notify Slack on Staging Failure (Reval)
        if: failure() && steps.confirm_staging.outcome == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/alerta-slack.js "ALERTA DE REGRESIÓN - REVAL STAGING" "Admin / Portal del Cliente" ""

  production-tests:
    name: Production Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: resultados.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps || (sleep 30 && npx playwright install --with-deps) || (sleep 60 && npx playwright install --with-deps)

      - name: Run Production Tests
        id: run_prod_tests
        continue-on-error: true
        run: npx playwright test tests/reval-prod-regression.spec.js tests/reval-customer-portal-prod.spec.js --reporter=html,json

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas
        id: confirm_prod
        if: steps.run_prod_tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/reval-prod-regression.spec.js tests/reval-customer-portal-prod.spec.js --reporter=html,json --last-failed

      - name: Upload Production HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 30

      # Alerta unificada (.github/scripts/alerta-slack.js): solo si la falla se CONFIRMÓ en la
      # segunda pasada, y dice qué test falló y por qué. Fallas del entorno de GitHub (npm,
      # instalación del navegador) no alertan: no son problemas de la tienda.
      - name: Notify Slack on Production Failure (Reval)
        if: failure() && steps.confirm_prod.outcome == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/alerta-slack.js "ALERTA DE REGRESIÓN - REVAL PRODUCCIÓN" "Admin / Portal del Cliente" ""

  theme-storefront-tests:
    name: Storefront Theme Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: resultados.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps || (sleep 30 && npx playwright install --with-deps) || (sleep 60 && npx playwright install --with-deps)

      - name: Run Theme Storefront Tests
        id: run_theme_tests
        continue-on-error: true
        run: npx playwright test tests/theme-prod-storefront.spec.js --reporter=html,json

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas
        id: confirm_theme
        if: steps.run_theme_tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/theme-prod-storefront.spec.js --reporter=html,json --last-failed

      - name: Upload Storefront HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-storefront
          path: playwright-report/
          retention-days: 30

      # Alerta unificada (.github/scripts/alerta-slack.js): solo si la falla se CONFIRMÓ en la
      # segunda pasada, y dice qué test falló y por qué. Fallas del entorno de GitHub (npm,
      # instalación del navegador) no alertan: no son problemas de la tienda.
      - name: Notify Slack on Storefront Failure (The Wellness Project)
        if: failure() && steps.confirm_theme.outcome == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_TWP_STOREFRONT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/alerta-slack.js "ALERTA DE STOREFRONT - THEME PRODUCTIVO" "The Wellness Project" "https://www.thewellnessproject.com.ar"
