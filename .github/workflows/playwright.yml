name: Playwright Daily E2E Regression - Reval (Lunes a Lunes)

on:
  schedule:
    # Corre automáticamente de Lunes a Lunes a las 8:00 AM (Hora Argentina / ART)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci || npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Staging Tests
      run: npx playwright test tests/reval-smoke-regression.spec.js

    - name: Run Production Tests
      run: npx playwright test tests/reval-prod-regression.spec.js

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Send Email Alert on Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: ⚠️ ALERTA: Fallo en Suite Diaria Reval (Shopify)
        to: angel.arellan@latechfactory.com
        from: QA Automation Bot
        body: La ejecución diaria de las 8:00 AM ha detectado un fallo en la suite de regresión de Reval (Staging o Producción). Revisa las trazas y capturas adjuntas en el reporte de GitHub Actions.
