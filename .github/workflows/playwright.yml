name: Playwright Daily E2E Regression - Reval (Cada 1 hora)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  staging-tests:
    name: Staging Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps || (sleep 30 && npx playwright install --with-deps) || (sleep 60 && npx playwright install --with-deps)

      - name: Run Staging Tests
        id: run_staging_tests
        continue-on-error: true
        run: npx playwright test tests/reval-smoke-regression.spec.js tests/reval-customer-portal-stg.spec.js --reporter=html

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas
        id: confirm_staging
        if: steps.run_staging_tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/reval-smoke-regression.spec.js tests/reval-customer-portal-stg.spec.js --reporter=html --last-failed

      - name: Upload Staging HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack on Staging Failure (Reval)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *ALERTA DE REGRESIÓN - REVAL STAGING*\n\n⚠️ *Atención Team:* Fallo detectado en el entorno de *STAGING* de Reval (Admin o Portal del Cliente)."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

  production-tests:
    name: Production Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps || (sleep 30 && npx playwright install --with-deps) || (sleep 60 && npx playwright install --with-deps)

      - name: Run Production Tests
        id: run_prod_tests
        continue-on-error: true
        run: npx playwright test tests/reval-prod-regression.spec.js tests/reval-customer-portal-prod.spec.js --reporter=html

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas
        id: confirm_prod
        if: steps.run_prod_tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/reval-prod-regression.spec.js tests/reval-customer-portal-prod.spec.js --reporter=html --last-failed

      - name: Upload Production HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack on Production Failure (Reval)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *ALERTA DE REGRESIÓN - REVAL PRODUCCIÓN*\n\n⚠️ *Atención Team:* Fallo detectado en el entorno de *PRODUCCIÓN* de Reval (Admin o Portal del Cliente)."}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

  theme-storefront-tests:
    name: Storefront Theme Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps || (sleep 30 && npx playwright install --with-deps) || (sleep 60 && npx playwright install --with-deps)

      - name: Run Theme Storefront Tests
        id: run_theme_tests
        continue-on-error: true
        run: npx playwright test tests/theme-prod-storefront.spec.js --reporter=html

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas
        id: confirm_theme
        if: steps.run_theme_tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/theme-prod-storefront.spec.js --reporter=html --last-failed

      - name: Upload Storefront HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-storefront
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack on Storefront Failure (The Wellness Project)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text": "🚨 *ALERTA DE STOREFRONT - THEME PRODUCTIVO*\n\n⚠️ *Atención Angel-Claudio:* Fallo detectado en la tienda online productiva (*www.thewellnessproject.com.ar*).\n\n📌 *Módulos que pudieron haber fallado:*\n• Home & Scroll\n• Buscador\n• Catálogo\n• PDP / Suscripción / Compra Única\n• Carrito & Checkout\n• Login & Políticas"}' \
          ${{ secrets.SLACK_WEBHOOK_TWP_STOREFRONT }}
