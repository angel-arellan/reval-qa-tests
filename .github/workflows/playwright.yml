name: Playwright Daily E2E Regression - Reval (Lunes a Lunes)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  # JOB 1: STAGING (Admin + Customer Portal)
  staging_tests:
    name: Staging Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_HTML_REPORT: playwright-report-staging
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci || npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Admin Staging Tests
      run: npx playwright test reval-smoke-regression.spec.js

    - name: Run Customer Portal Staging Tests
      run: npx playwright test reval-customer-portal-stg.spec.js

    - name: Upload Staging Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-staging
        path: playwright-report-staging/
        retention-days: 30

    - name: Send Slack Alert on Staging Failure
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text": "⚠️ *Atención Angel-Claudio:* Se detectó un error en el entorno de *STAGING* (Admin o Portal del Cliente)."}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}

  # JOB 2: PRODUCCIÓN (Admin Prod)
  production_tests:
    name: Production Environment Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_HTML_REPORT: playwright-report-prod
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: npm ci || npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Admin Production Tests
      run: npx playwright test reval-prod-regression.spec.js

    - name: Upload Production Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-prod
        path: playwright-report-prod/
        retention-days: 30

    - name: Send Slack Alert on Production Failure
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text": "⚠️ *Atención Angel-Claudio:* Se detectó un error CRÍTICO en el entorno de *PRODUCCIÓN*."}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
