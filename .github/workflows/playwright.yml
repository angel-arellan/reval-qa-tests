name: Playwright Daily E2E Regression - Reval (Lunes a Lunes)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci || npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Admin Staging Tests
      id: staging_admin
      run: npx playwright test tests/reval-smoke-regression.spec.js --reporter=html

    - name: Run Admin Production Tests
      id: prod_admin
      run: npx playwright test tests/reval-prod-regression.spec.js --reporter=html

    - name: Run Customer Portal Staging Tests
      id: staging_customer
      run: npx playwright test tests/reval-customer-portal-stg.spec.js --reporter=html

    - name: Upload Test Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Send Slack Alert ONLY on Failure
      if: failure()
      run: |
        curl -X POST -H 'Content-type: application/json' \
        --data '{"text": "🚨 *ALERTA DE REGRESIÓN: Fallo detectado en Reval*\n\nSe ha detectado un error en las pruebas e2e automatizadas (Admin o Portal de Cliente).\n\nRevisa el reporte HTML en GitHub Actions para aislar la falla."}' \
        ${{ secrets.SLACK_WEBHOOK_URL }}
