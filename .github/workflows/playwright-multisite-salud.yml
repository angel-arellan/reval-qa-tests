name: Playwright Multisite Salud Técnica y Responsive (Cada 2 horas)

# Suites de salud técnica (tests/storefront-multisite-salud.spec.js) y responsive/mobile
# (tests/storefront-multisite-responsive.spec.js) para todas las tiendas de
# tests/config/sites.js. Corre a los :30 de las horas pares para no coincidir con la suite
# funcional multisite (que corre a los :00 de cada hora). Solo lectura: no crea pedidos ni
# envía formularios en las tiendas de clientes.

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

concurrency:
  group: multisite-salud
  cancel-in-progress: false

jobs:
  discover-sites:
    name: Descubrir sitios configurados
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar matrix desde tests/config/sites.js
        id: set-matrix
        run: |
          SITES=$(node -e "console.log(JSON.stringify(require('./tests/config/sites.js').map(({id, name, baseUrl}) => ({id, name, baseUrl}))))")
          echo "matrix={\"include\":$SITES}" >> "$GITHUB_OUTPUT"

  salud-tecnica:
    name: Salud y Responsive - ${{ matrix.name }}
    needs: discover-sites
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: resultados.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-sites.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps chromium || (sleep 30 && npx playwright install --with-deps chromium) || (sleep 60 && npx playwright install --with-deps chromium)

      - name: Run Salud Técnica y Responsive - ${{ matrix.name }}
        id: tests
        continue-on-error: true
        run: npx playwright test tests/storefront-multisite-salud.spec.js tests/storefront-multisite-responsive.spec.js --grep "${{ matrix.id }}-(SALUD|RESP)-" --reporter=html,json

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas - ${{ matrix.name }}
        id: confirm
        if: steps.tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/storefront-multisite-salud.spec.js tests/storefront-multisite-responsive.spec.js --grep "${{ matrix.id }}-(SALUD|RESP)-" --reporter=html,json --last-failed

      - name: Upload HTML Report - ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-salud-${{ matrix.id }}
          path: playwright-report/
          retention-days: 30

      # Alerta unificada (.github/scripts/alerta-slack.js): solo si la falla se CONFIRMÓ en la
      # segunda pasada, y dice qué test falló y por qué. Fallas del entorno de GitHub (npm,
      # instalación del navegador) no alertan: no son problemas de la tienda.
      - name: Notify Slack (Management) on Failure - ${{ matrix.name }}
        if: failure() && steps.confirm.outcome == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_MULTISITE_MANAGEMENT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/alerta-slack.js "ALERTA DE SALUD TÉCNICA / RESPONSIVE" "${{ matrix.name }}" "${{ matrix.baseUrl }}"
