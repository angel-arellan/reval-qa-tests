name: Playwright Multisite Salud Técnica (Cada 2 horas)

# Suite de salud técnica (tests/storefront-multisite-salud.spec.js) para todas las tiendas de
# tests/config/sites.js. Corre a los :30 de las horas pares para no coincidir con la suite
# funcional multisite (que corre a los :00 de cada hora). Solo lectura: no crea pedidos ni
# envía formularios en las tiendas de clientes.

on:
  schedule:
    - cron: '30 */2 * * *'
  workflow_dispatch:

concurrency:
  group: multisite-salud
  cancel-in-progress: false

jobs:
  discover-sites:
    name: Descubrir sitios configurados
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar matrix desde tests/config/sites.js
        id: set-matrix
        run: |
          SITES=$(node -e "console.log(JSON.stringify(require('./tests/config/sites.js').map(({id, name, baseUrl}) => ({id, name, baseUrl}))))")
          echo "matrix={\"include\":$SITES}" >> "$GITHUB_OUTPUT"

  salud-tecnica:
    name: Salud - ${{ matrix.name }}
    needs: discover-sites
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-sites.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Salud Técnica - ${{ matrix.name }}
        run: npx playwright test tests/storefront-multisite-salud.spec.js --grep "${{ matrix.id }}-SALUD-" --reporter=html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: resultados.json

      - name: Upload HTML Report - ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-salud-${{ matrix.id }}
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack (Management) on Failure - ${{ matrix.name }}
        if: failure()
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_MULTISITE_MANAGEMENT }}
          SITE_NAME: ${{ matrix.name }}
          SITE_URL: ${{ matrix.baseUrl }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Arma la lista de chequeos que fallaron leyendo el reporte JSON de Playwright.
          FALLIDOS=$(node -e "
            const fs = require('fs');
            if (!fs.existsSync('resultados.json')) { console.log('• (no se pudo leer el reporte)'); process.exit(0); }
            const r = JSON.parse(fs.readFileSync('resultados.json', 'utf8'));
            const out = [];
            const walk = (s) => { (s.suites || []).forEach(walk); (s.specs || []).forEach((sp) => {
              const ok = sp.tests.every((t) => ['expected', 'skipped', 'flaky'].includes(t.status));
              if (!ok) out.push('• ' + sp.title.replace(/^[A-Z0-9_]+-/, ''));
            }); };
            (r.suites || []).forEach(walk);
            console.log(out.join('\n') || '• (error general del job)');
          ")
          PAYLOAD=$(node -e "
            const [name, url, fallidos, run] = process.argv.slice(1);
            console.log(JSON.stringify({ text:
              '🩺 *ALERTA DE SALUD TÉCNICA - ' + name + '*\n\n' +
              '⚠️ *Atención Management:* Problemas técnicos detectados en la tienda productiva (*' + url + '*).\n\n' +
              '📌 *Chequeos que fallaron:*\n' + fallidos + '\n\n' +
              '🔗 Reporte: ' + run
            }));
          " "$SITE_NAME" "$SITE_URL" "$FALLIDOS" "$RUN_URL")
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"
