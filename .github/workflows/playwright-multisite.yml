name: Playwright Multisite Storefront Tests (Cada 1 hora)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  discover-sites:
    name: Descubrir sitios configurados
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar matrix desde tests/config/sites.js
        id: set-matrix
        run: |
          SITES=$(node -e "console.log(JSON.stringify(require('./tests/config/sites.js')))")
          echo "matrix={\"include\":$SITES}" >> "$GITHUB_OUTPUT"

  storefront-multisite-tests:
    name: Storefront - ${{ matrix.name }}
    needs: discover-sites
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: resultados.json
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-sites.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      - name: Install Playwright Browsers
        # Reintento: el apt-get de GitHub a veces falla por un mirror caído (exit code 100)
        # y eso disparaba una alerta de Slack sin que ningún test hubiera corrido.
        run: npx playwright install --with-deps || (sleep 30 && npx playwright install --with-deps) || (sleep 60 && npx playwright install --with-deps)

      - name: Run Storefront Tests - ${{ matrix.name }}
        id: tests
        continue-on-error: true
        run: npx playwright test tests/storefront-multisite.spec.js --grep "${{ matrix.id }}-" --reporter=html,json

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) este paso queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas - ${{ matrix.name }}
        id: confirm
        if: steps.tests.outcome == 'failure'
        run: |
          sleep 180
          npx playwright test tests/storefront-multisite.spec.js --grep "${{ matrix.id }}-" --reporter=html,json --last-failed
      - name: Upload HTML Report - ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-multisite-${{ matrix.id }}
          path: playwright-report/
          retention-days: 30

      # Alerta unificada (.github/scripts/alerta-slack.js): solo si la falla se CONFIRMÓ en la
      # segunda pasada, y dice qué test falló y por qué. Fallas del entorno de GitHub (npm,
      # instalación del navegador) no alertan: no son problemas de la tienda.
      - name: Notify Slack (Management) on Failure - ${{ matrix.name }}
        if: failure() && steps.confirm.outcome == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_MULTISITE_MANAGEMENT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/alerta-slack.js "ALERTA DE STOREFRONT" "${{ matrix.name }}" "${{ matrix.baseUrl }}"
