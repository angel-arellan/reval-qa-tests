name: Playwright Multisite Storefront Tests (Cada 1 hora)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  discover-sites:
    name: Descubrir sitios configurados
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar matrix desde tests/config/sites.js
        id: set-matrix
        run: |
          SITES=$(node -e "console.log(JSON.stringify(require('./tests/config/sites.js')))")
          echo "matrix={\"include\":$SITES}" >> "$GITHUB_OUTPUT"

  storefront-multisite-tests:
    name: Storefront - ${{ matrix.name }}
    needs: discover-sites
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-sites.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Storefront Tests - ${{ matrix.name }}
        id: tests
        continue-on-error: true
        run: npx playwright test tests/storefront-multisite.spec.js --grep "${{ matrix.id }}-" --reporter=html

      # Anti falsas alarmas: si algo falló (ya con los 2 reintentos de Playwright, o sea 3
      # intentos), se espera unos minutos y se re-ejecuta SOLO lo que falló. Únicamente si
      # vuelve a fallar (6 intentos en total, separados en el tiempo) el job queda en rojo y
      # se avisa a Slack. Filtra cortes de red, CDNs lentos y popups intermitentes de CI.
      - name: Confirmar fallas - ${{ matrix.name }}
        id: confirm
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        run: |
          sleep 180
          npx playwright test tests/storefront-multisite.spec.js --grep "${{ matrix.id }}-" --reporter=html --last-failed

      - name: Resultado final - ${{ matrix.name }}
        if: steps.tests.outcome == 'failure' && steps.confirm.outcome != 'success'
        run: |
          echo "::error::Falla confirmada: los tests fallaron también en la re-ejecución de confirmación."
          exit 1

      - name: Upload HTML Report - ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-multisite-${{ matrix.id }}
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack (Management) on Failure - ${{ matrix.name }}
        if: failure()
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\": \"🚨 *ALERTA DE STOREFRONT - ${{ matrix.name }}*\n\n⚠️ *Atención Management:* Fallo detectado en la tienda online productiva (*${{ matrix.baseUrl }}*).\n\n📌 *Módulos que pudieron haber fallado:*\n• Home & Scroll\n• Buscador\n• Catálogo\n• PDP / Carrito & Checkout\n• Login & Políticas\"}" \
          "${{ secrets.SLACK_WEBHOOK_MULTISITE_MANAGEMENT }}"
