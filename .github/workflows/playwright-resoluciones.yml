name: Playwright Multi-resolución - Escritorio, Celulares y Tablets (Cada 4 horas)

# Corre las mismas pruebas de compra que la suite multisite horaria (menú, buscador, filtros,
# carrito y checkout sin comprar) en 4 resoluciones de escritorio, 5 celulares y 2 tablets,
# para todas las tiendas de tests/config/sites.js y The Wellness Project. Para la web de Latech
# (LATECH_FACTORY) suma tests/web-latech.spec.js: todas las páginas, menú, casos, blog y
# formulario de contacto (sin enviarlo).
#
# No tiene tests propios: tests/resoluciones/generar.js copia los specs que ya corren en
# producción con otro tamaño de pantalla (ver tests/config/resoluciones.js). Los specs y
# workflows existentes no se tocan.
#
# Minuto 23 a propósito: los horarios en punto (:00) son los de más carga en GitHub y muchas
# corridas programadas se pierden. Solo lectura y carrito: nunca compra ni envía formularios, y
# no manda hits de analítica a las tiendas (los bloquea generar.js).
#
# Un job por tienda y resolución (nov-2026): con un solo job por tienda, las 3 resoluciones del
# lote salían desde el mismo servidor de GitHub y, a mitad de la tanda, Shopify empezaba a pedir
# verificación anti-robots ("Just a moment...") y a frenar el "agregar al carrito" (HTTP 429):
# pasaban las de escritorio y caían las de celular y tablet, que corrían después. Separadas,
# cada IP hace un tercio de las visitas, como la suite horaria, que no se bloquea.

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'Lote de resoluciones (0 a 3, ver tests/config/resoluciones.js). Vacío = el que toca (rota en cada corrida)'
        required: false

concurrency:
  group: multisite-resoluciones
  cancel-in-progress: false

jobs:
  discover-sites:
    name: Descubrir sitios configurados
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Un lote por corrida (ver tests/config/resoluciones.js), rotando por número de corrida.
      # Antes rotaba por la hora de arranque, pero GitHub larga las corridas programadas con
      # horas de demora y el lote 2 no salía nunca. Así cada corrida toma el lote siguiente.
      - name: Generar matrix (tiendas × resoluciones del lote)
        id: set-matrix
        env:
          LOTE_MANUAL: ${{ inputs.lote }}
          CORRIDA: ${{ github.run_number }}
        run: |
          node -e "
            const { resoluciones } = require('./tests/config/resoluciones.js');
            const lotes = [...new Set(resoluciones.map((r) => r.lote))].sort();
            const lote = process.env.LOTE_MANUAL !== '' && process.env.LOTE_MANUAL !== undefined
              ? Number(process.env.LOTE_MANUAL) : lotes[Number(process.env.CORRIDA) % lotes.length];
            const elegidas = resoluciones.filter((r) => r.lote === lote);
            if (!elegidas.length) throw new Error('El lote ' + lote + ' no tiene resoluciones (ver tests/config/resoluciones.js)');
            console.log('Lote de resoluciones: ' + lote + ' → ' + elegidas.map((r) => r.nombre).join(', '));
            const s = require('./tests/config/sites.js').map(({ id, name, baseUrl }) => ({ id, name, baseUrl }));
            s.push({ id: 'TWP', name: 'The Wellness Project', baseUrl: 'https://www.thewellnessproject.com.ar' });
            const include = s.flatMap((x) => elegidas.map((r) => ({ ...x, res: r.id, pantalla: r.nombre, grupo: r.grupo })));
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({ include }) + '\\n');
          "

  resoluciones:
    # El informe semanal (.github/scripts/reporte-semanal.js) agrupa por "Resoluciones - <tienda>"
    # lo que va antes de " · ": no cambiar ese formato sin ajustar el informe.
    name: Resoluciones - ${{ matrix.name }} · ${{ matrix.pantalla }}
    needs: discover-sites
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: resultados.json
    strategy:
      fail-fast: false
      # Deja lugar a las suites horarias (GitHub corre hasta 20 jobs a la vez en el plan gratis).
      max-parallel: 12
      matrix: ${{ fromJson(needs.discover-sites.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || (sleep 20 && npm ci)

      # Celulares y tablets se emulan en Chromium (tamaño, pantalla táctil y user agent del
      # dispositivo), igual que la suite responsive existente.
      - name: Install Playwright Browsers
        run: bash .github/scripts/instalar-chromium.sh

      - name: Generar suite (${{ matrix.pantalla }})
        env:
          RESOLUCION: ${{ matrix.res }}
        run: node tests/resoluciones/generar.js

      # La web de Latech (web-latech.spec.js) tiene sus propios tamaños: corre una sola vez por
      # corrida, en el job de escritorio. Un reintento por test (no dos): si una tienda frena a
      # los servidores de prueba, reintentar en el acto suma visitas y agranda el bloqueo.
      - name: Run Resoluciones - ${{ matrix.name }} · ${{ matrix.pantalla }}
        id: tests
        continue-on-error: true
        run: |
          ARCHIVOS="tests/generados"
          if [ "${{ matrix.grupo }}" = "escritorio" ]; then ARCHIVOS="$ARCHIVOS tests/web-latech.spec.js"; fi
          npx playwright test $ARCHIVOS --grep "${{ matrix.id }}-" --workers=1 --retries=1 --reporter=html,json

      # Anti falsas alarmas, igual que en las demás suites: se re-ejecuta solo lo que falló unos
      # minutos después y únicamente si vuelve a fallar se avisa a Slack.
      - name: Confirmar fallas - ${{ matrix.name }} · ${{ matrix.pantalla }}
        id: confirm
        if: steps.tests.outcome == 'failure'
        run: |
          sleep 180
          ARCHIVOS="tests/generados"
          if [ "${{ matrix.grupo }}" = "escritorio" ]; then ARCHIVOS="$ARCHIVOS tests/web-latech.spec.js"; fi
          npx playwright test $ARCHIVOS --grep "${{ matrix.id }}-" --workers=1 --retries=1 --reporter=html,json --last-failed

      - name: Upload HTML Report - ${{ matrix.name }} · ${{ matrix.pantalla }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-resoluciones-${{ matrix.id }}-${{ matrix.res }}
          path: playwright-report/
          retention-days: 14

      # El paso corre siempre que haya una falla confirmada (el informe semanal lee de su log qué
      # test falló), pero solo publica en Slack si la variable del repo RESOLUCIONES_SLACK = si.
      # Arranca apagado mientras se calibran las resoluciones nuevas, para no llenar Slack.
      - name: Notify Slack (Management) on Failure - ${{ matrix.name }} · ${{ matrix.pantalla }}
        if: failure() && steps.confirm.outcome == 'failure'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ vars.RESOLUCIONES_SLACK == 'si' && secrets.SLACK_WEBHOOK_MULTISITE_MANAGEMENT || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/alerta-slack.js "ALERTA MULTI-RESOLUCIÓN" "${{ matrix.name }} · ${{ matrix.pantalla }}" "${{ matrix.baseUrl }}"
